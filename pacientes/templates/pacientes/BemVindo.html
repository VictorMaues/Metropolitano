{% load static %}
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Atendimento - Hospital Metropolitano</title>
    <link rel="stylesheet" href="{% static 'pacientes/css/welcome.css' %}?v=1.1">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
</head>

<body>
    <div class="container">
        <header>
            <h1 class="logo">Hospital Metropolitano</h1>
        </header>
        
        <nav class="navbar">
            <ul>
                <li><a href="#home">Home</a></li>
                <li><a href="#consultas">Consultas</a></li>
                <li><a href="#exames">Exames</a></li>
                <li><a href="#relatorios">Relatórios</a></li>
            </ul>
        </nav>

        <div class="fas fa-bars"></div>

    </div>

    <section id="home" class="home">

        <div class="row">
            <div class="images">
                <img src="{% static 'pacientes/img/home.png' %}" alt="Imagem de um médico">
            </div>

            <div class="content">
                <h1>Bem-vindo ao Painel de Atendimento</h1>
                <p>Seja bem-vindo ao nosso sistema de atendimento. Aqui você pode gerenciar suas consultas, exames e relatórios.</p>
                <a class="btn" href="{% url 'admin:login' %}">Entrar</a>
            </div>
                

        </div>
    </section>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/4.0.0/jquery.min.js"></script>
    <script>
        $(document).ready(function() {
            $('.fa-bars').click(function() {
                $('.navbar ul').toggle();
            });
        });
    </script>
</body>

</html>
